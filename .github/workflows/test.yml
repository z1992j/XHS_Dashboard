name: CI Tests

on:
  push:
    # 任意分支都跑。仓库现在只有工作分支（没有 main），原来的
    # [main, dev] 会让推上去的代码一次 CI 都不过 —— 而这些门禁
    # （tsc strict / vitest / 构建产物相对路径 / PWA 资产）正是
    # 上一轮「全绿但其实没上线」的教训换来的，不能只在合并后生效。
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  server:
    name: Backend (Node syntax + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'
      - name: Configure npm resiliency
        run: |
          npm config set fetch-timeout 60000
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 10000
          npm config set fetch-retry-maxtimeout 60000
      - name: Install
        run: npm ci --no-audit --no-fund --loglevel=http
        timeout-minutes: 6
      - name: Syntax check
        run: |
          node --check src/index.js
          node --check src/xhs-writer.js
      - name: Vitest
        run: npm test

  web:
    name: Frontend (TypeScript strict + Vitest + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'
      - name: Configure npm resiliency
        run: |
          npm config set fetch-timeout 60000
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 10000
          npm config set fetch-retry-maxtimeout 60000
      - name: Install
        run: npm ci --no-audit --no-fund --loglevel=http
        timeout-minutes: 6

      # lightningcss 的可选原生依赖在 npm ci 下装不上，Tailwind 4 一到
      # 构建就报 Cannot find module '../lightningcss.linux-x64-gnu.node'。
      # --no-save 保证不动 lockfile。
      - name: Install Linux native bindings (lightningcss fix)
        run: |
          npm install lightningcss-linux-x64-gnu@1.32.0 --no-save 2>/dev/null || true

      - name: TypeScript strict check
        run: npx tsc --noEmit
      - name: Vitest
        run: npm test
      - name: Production build
        run: npx vite build

      # 订单模块现在是原生 React，随 SPA 一起构建；它不再有 public/orders/
      # 那样的独立静态目录。但「一份 dist 放任意静态路径」这个前提是
      # base:'./' 撑起来的 —— 谁把它改回绝对路径，部署就会被绑死在 /dashboard/，
      # 换目录时表现为白屏而不是报错。这里在构建产物层面直接卡住。
      - name: Verify path-agnostic build
        run: |
          grep -q 'src="\./assets/' dist/index.html || { echo '❌ index.html 的资源不是相对路径（vite base 被改了？）'; exit 1; }
          grep -q 'href="\./\|href="manifest' dist/index.html || { echo '❌ manifest 引用异常'; exit 1; }

      # PWA 资产由 public/ 原样拷进 dist，漏拷不会让构建失败，只会让
      # 「装到主屏」和离线路径静默失效 —— 上面那些都还是绿的。
      - name: Verify PWA assets shipped
        run: |
          for f in sw.js manifest.webmanifest icon-192.png icon-512.png logo.svg; do
            [ -f "dist/$f" ] || { echo "❌ dist/$f 缺失"; exit 1; }
          done
          node -e "JSON.parse(require('fs').readFileSync('dist/manifest.webmanifest','utf8'))"
