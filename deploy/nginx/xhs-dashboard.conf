# 小红书运营工作台 —— nginx 配置片段
#
# 只需要新增一个 location。/api/ 的反代、/api/xhs/uploads 的静态目录、
# 以及 landing 页的 root 都是线上 broadband-api 站点上**已有**的配置，
# 不要在这里重复写一遍 —— 同一个 server 块里重复 listen / 重复
# location /api/ 会让 nginx -t 直接失败，站点 reload 不起来。
#
# ---------------------------------------------------------------------------
# 应用方式（服务器上，一次性）
# ---------------------------------------------------------------------------
#   1. 找到现有站点的 server 块：
#        sudo grep -rn "location /api" /etc/nginx/
#      线上是 http://47.252.19.224/ 这个 :80 站点（同时挂着 /writer/ 与 /api/）。
#
#   2. 把下面这段整块粘进那个 server 块内，与 location /writer/ 平级：
#
#        # 小红书运营工作台（vite base = /dashboard/）
#        # 销售订单模块在 /dashboard/orders/ 下，是同一份 dist 里的静态文件。
#        # try_files 的顺序不能反：订单页是真文件，必须先按文件命中，
#        # 否则会被 SPA 回退兜成 index.html，iframe 里套一层外壳，无限递归。
#        location /dashboard/ {
#            alias /var/www/xhs-dashboard/;
#            index index.html;
#            try_files $uri $uri/ /dashboard/index.html;
#        }
#
#   3. 校验并热加载：
#        sudo nginx -t && sudo systemctl reload nginx
#
#   4. 验证：
#        curl -I http://localhost/dashboard/
#        curl -I http://localhost/dashboard/orders/index.html   # 必须是 200
#
# ---------------------------------------------------------------------------
# 两个容易踩的地方
# ---------------------------------------------------------------------------
# - alias 与 try_files 的配对：location 以 / 结尾时 alias 也必须以 / 结尾，
#   且 try_files 的兜底要写绝对路径 /dashboard/index.html。写成 index.html
#   会去 root 下找，报 403 或 404。
#
# - 读图请求（/api/xhs/ai/vision）要等上游模型几十秒，nginx 默认
#   proxy_read_timeout 60s 会把它掐在半路，浏览器只看到一个无从下手的
#   网络错误；请求体是 base64 图片，client_max_body_size 默认 1MB 也不够。
#   这两项线上现有配置已经调过（前端把预算压在 900KB，见 lib/image.ts），
#   如果新站点是另起一个 server 块而不是复用，记得一并带上。
