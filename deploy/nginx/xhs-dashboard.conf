# 红薯运营工作台 —— nginx 配置片段
#
# 只需要新增一个 location。/api/ 的反代、/api/xhs/uploads 的静态目录、
# 以及 landing 页的 root 都是线上 broadband-api 站点上**已有**的配置，
# 不要在这里重复写一遍 —— 同一个 server 块里重复 listen / 重复
# location /api/ 会让 nginx -t 直接失败，站点 reload 不起来。
#
# ---------------------------------------------------------------------------
# 应用方式（服务器上，一次性）
# ---------------------------------------------------------------------------
#   1. 找到现有站点的 server 块：
#        sudo grep -rn "location /api" /etc/nginx/
#      线上是 http://47.252.19.224/ 这个 :80 站点（同时挂着 /writer/ 与 /api/）。
#
#   2. 把下面这段整块粘进那个 server 块内，与 location /writer/ 平级：
#
#        # 红薯运营工作台：一份 dist，三个模块（仿写 / 素材 / 订单）全在里面。
#        # 订单已经是 SPA 的原生页面（#/orders），不再有 /dashboard/orders/
#        # 这样的子目录静态文件 —— iframe 时代的那条 location 和对应文件都不需要了。
#        # vite base 是 './'，资源全是相对路径，所以这个目录挪到任何前缀都能跑。
#        location /dashboard/ {
#            alias /var/www/xhs-dashboard/;
#            index index.html;
#            try_files $uri $uri/ /dashboard/index.html;
#        }
#
#   3. 校验并热加载：
#        sudo nginx -t && sudo systemctl reload nginx
#
#   4. 验证（必须看内容，别看状态码）：
#        curl -s http://localhost/dashboard/ | grep -c 红薯运营工作台   # 必须是 1
#        curl -s http://localhost/dashboard/sw.js | grep -c xhs-workbench-
#        # 取入口页里那个 hashed JS，确认拿回来的不是 HTML：
#        A=$(curl -s http://localhost/dashboard/ | grep -o 'src="\./assets/[^"]*\.js"' | head -1 | sed 's/^src="\.\///; s/"$//')
#        curl -s "http://localhost/dashboard/$A" | head -c 80
#
# ---------------------------------------------------------------------------
# 几个容易踩的地方
# ---------------------------------------------------------------------------
# - 这台机器有 catch-all：任何不存在的路径都返回 200 + landing 页
#   （/nope-xyz 实测也是 200）。所以 location 没配、目录没建的时候
#   `curl -I` 照样 200 —— 上一版就是这么「部署成功」而实际从没上线。
#   验证一律按上面的内容标记判。
#
# - 同一条 try_files 也会把缺失的 .js / .css 兜成 index.html（仍是 200，
#   内容是 HTML）。构建坏了或 assets 只换了一半时页面白屏，状态码全绿。
#   所以要取真实哈希文件名再探一次，并确认返回体不是 <!DOCTYPE html>。
#
# - alias 与 try_files 的配对：location 以 / 结尾时 alias 也必须以 / 结尾，
#   且 try_files 的兜底要写绝对路径 /dashboard/index.html。写成 index.html
#   会去 root 下找，报 403 或 404。
#
# - 读图请求（/api/xhs/ai/vision）要等上游模型几十秒，nginx 默认
#   proxy_read_timeout 60s 会把它掐在半路，浏览器只看到一个无从下手的
#   网络错误；请求体是 base64 图片，client_max_body_size 默认 1MB 也不够。
#   这两项线上现有配置已经应用过了，如果新站点是另起一个 server 块而不是
#   复用，记得一并带上。
